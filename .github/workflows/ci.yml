name: Static checks
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 scripts/check_workflows.py
      - run: python3 scripts/build.py validate
      - name: Lua and translation validation tools
        run: sudo apt-get update && sudo apt-get install -y lua5.1 gettext
      - run: python3 -m unittest discover -s tests -v
      - name: LuCI form compatibility
        run: |
          for test in tests/js/*_form.cjs; do node "$test"; done
          find local-packages -name '*.js' -type f -print0 | xargs -0 -n 1 node --check
      - name: Shell syntax
        run: find local-packages scripts -type f \( -name '*.sh' -o -name '*.init' \) -print0 | xargs -0 -n 1 sh -n

  ha-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev libnl-3-dev libnl-genl-3-dev iproute2 iputils-ping curl
      - name: Build the firmware feed's keepalived 2.3.3 (verified SHA256)
        run: python3 scripts/build_test_keepalived.py
      - name: Real VRRP election, WAN failure and primary recovery with noexec run directory
        run: |
          sudo env "PATH=$GITHUB_WORKSPACE/.work/tools/keepalived-2.3.3/sbin:$PATH" \
            unshare --mount --propagation private sh -eu -c '
              mount --bind /run /run
              mount -o remount,bind,noexec /run
              exec python3 tests/integration/keepalived_netns.py
            '
      - name: Dual-path VRRP, individual link loss and WAN failover
        run: sudo env "PATH=$GITHUB_WORKSPACE/.work/tools/keepalived-2.3.3/sbin:$PATH" python3 tests/integration/keepalived_netns.py --dual-path

  l2vpn-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update && sudo apt-get install -y curl openssl iproute2 iputils-ping wireguard-tools kmod
      - name: Stage official Xray 26.3.27 (verified SHA256)
        run: python3 scripts/fetch_test_xray.py
      - name: Native TLS/REALITY parser and VLESS UDP round trip
        run: sudo python3 tests/integration/l2vpn_transport.py --core .work/tools/xray-26.3.27/xray
      - name: Kernel L2TPv3 and VXLAN over WireGuard, direct and over VLESS
        run: |
          for module in wireguard l2tp_eth vxlan; do
            if ! sudo modprobe "$module"; then
              echo "::error title=L2 VPN kernel module::Cannot load required module $module"
              exit 1
            fi
          done
          sudo python3 tests/integration/l2vpn_netns.py --core .work/tools/xray-26.3.27/xray
