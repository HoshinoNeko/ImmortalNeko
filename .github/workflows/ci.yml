name: Static checks
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 scripts/check_workflows.py
      - run: python3 scripts/build.py validate
      - run: python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: find local-packages scripts -type f \( -name '*.sh' -o -name '*.init' \) -print0 | xargs -0 -n 1 sh -n

  ha-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update && sudo apt-get install -y keepalived iproute2 iputils-ping
      - name: Real VRRP election, WAN failure and primary recovery
        run: sudo python3 tests/integration/keepalived_netns.py
