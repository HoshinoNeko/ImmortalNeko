name: Build firmware
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        default: x86-basic
        options: [x86-basic, x86-ha, r619ac-basic, r619ac-ha, all]
        description: Build profile (R619AC 128MiB NAND / 512MiB RAM)
      publish:
        type: boolean
        default: false
        description: Create a draft GitHub Release
      compile_jobs:
        type: choice
        default: auto
        options: [auto, '1', '2', '4', '8']
        description: Parallel compile jobs (auto uses available CPU and memory)
      use_cache:
        type: boolean
        default: true
        description: Restore and save download, C/C++ and Go caches
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false
jobs:
  check:
    uses: ./.github/workflows/ci.yml
  plan:
    needs: check
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: matrix
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          matrix=$(python3 scripts/build.py matrix --profile "$PROFILE")
          echo "value=$matrix" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.work/ccache
      CCACHE_MAXSIZE: 2Gi
      CCACHE_COMPILERCHECK: content
      CCACHE_STATSLOG: ${{ github.workspace }}/.work/logs/ccache-stats.log
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd libelf-dev pkgconf
          df -h .
      - name: Plan caches and compile parallelism
        id: acceleration
        env:
          PROFILE: ${{ matrix.profile }}
          COMPILE_JOBS: ${{ inputs.compile_jobs }}
        run: python3 scripts/build_accel.py plan --profile "$PROFILE" --jobs "$COMPILE_JOBS"
      - name: Restore shared downloads
        id: downloads-cache
        if: inputs.use_cache
        continue-on-error: true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .work/downloads
          key: ${{ steps.acceleration.outputs.downloads_prefix }}${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
          restore-keys: |
            ${{ steps.acceleration.outputs.downloads_prefix }}
            ${{ steps.acceleration.outputs.downloads_fallback }}
      - name: Restore target compiler cache
        id: compiler-cache
        if: inputs.use_cache
        continue-on-error: true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .work/ccache
          key: ${{ steps.acceleration.outputs.compiler_prefix }}${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
          restore-keys: ${{ steps.acceleration.outputs.compiler_prefix }}
      - name: Restore target Go build cache
        id: go-cache
        if: inputs.use_cache
        continue-on-error: true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .work/go-build
          key: ${{ steps.acceleration.outputs.go_prefix }}${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
          restore-keys: ${{ steps.acceleration.outputs.go_prefix }}
      - name: Import an older combined cache on the first layered build
        id: legacy-cache
        if: inputs.use_cache && steps.downloads-cache.outputs.cache-matched-key == '' && steps.compiler-cache.outputs.cache-matched-key == ''
        continue-on-error: true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            .work/downloads
            .work/ccache
          key: legacy-import-${{ runner.os }}-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fw-${{ runner.os }}-${{ matrix.profile }}-
      - name: Prepare pinned source and resolve configuration
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -o pipefail
          mkdir -p .work/logs
          python3 scripts/build.py prepare --profile "$PROFILE" 2>&1 | tee .work/logs/prepare.log
      - name: Download source archives
        id: download
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -o pipefail
          python3 scripts/build.py download --profile "$PROFILE" --jobs 4 2>&1 | tee .work/logs/download.log
      - name: Save verified downloads before compilation
        if: inputs.use_cache && steps.downloads-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .work/downloads
          key: ${{ steps.acceleration.outputs.downloads_prefix }}${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
      - name: Compile full source
        id: compile
        env:
          PROFILE: ${{ matrix.profile }}
          COMPILE_JOBS: ${{ steps.acceleration.outputs.jobs }}
        run: |
          set -o pipefail
          python3 scripts/build.py compile --profile "$PROFILE" --jobs "$COMPILE_JOBS" 2>&1 | tee .work/logs/compile.log
      - name: Record cache statistics and build timings
        if: always() && !cancelled() && steps.acceleration.outcome == 'success'
        continue-on-error: true
        env:
          DOWNLOADS_MATCHED: ${{ steps.downloads-cache.outputs.cache-matched-key || steps.legacy-cache.outputs.cache-matched-key }}
          COMPILER_MATCHED: ${{ steps.compiler-cache.outputs.cache-matched-key || steps.legacy-cache.outputs.cache-matched-key }}
          GO_MATCHED: ${{ steps.go-cache.outputs.cache-matched-key }}
        run: python3 scripts/build_accel.py report
      - name: Save compiler cache after successful or failed compilation
        if: always() && !cancelled() && inputs.use_cache && steps.compiler-cache.outputs.cache-hit != 'true' && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure')
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .work/ccache
          key: ${{ steps.acceleration.outputs.compiler_prefix }}${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
      - name: Save Go cache after successful or failed compilation
        if: always() && !cancelled() && inputs.use_cache && steps.go-cache.outputs.cache-hit != 'true' && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure')
        continue-on-error: true
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .work/go-build
          key: ${{ steps.acceleration.outputs.go_prefix }}${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
      - name: Collect verified outputs
        env:
          PROFILE: ${{ matrix.profile }}
        run: python3 scripts/build.py collect --profile "$PROFILE" --out "artifacts/$PROFILE"
      - name: Upload firmware and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-${{ matrix.profile }}
          path: artifacts/${{ matrix.profile }}/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build logs even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: logs-${{ matrix.profile }}
          path: |
            .work/logs/
            .work/source/logs/
            .work/requested.config
            .work/source/.config
          include-hidden-files: true
          retention-days: 14
  release:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: firmware-*
          path: release-input
      - name: Package and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          BUILDER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir release-assets
          for dir in release-input/firmware-*; do
            (cd "$dir" && sha256sum -c SHA256SUMS)
            name=$(basename "$dir")
            tar -czf "release-assets/$name.tar.gz" -C "$dir" .
          done
          (cd release-assets && sha256sum *.tar.gz > SHA256SUMS)
          gh release create "build-$RUN_ID-$RUN_ATTEMPT" release-assets/* --target "$BUILDER_SHA" --title "Firmware build $RUN_ID" --notes-file docs/release-notes.md --draft
